services:
  - type: web
    name: kasbim-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd backend && python -m app.ml.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
